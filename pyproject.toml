[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "bookvoice"
dynamic = ["version"]
description = "Convert EPUB, MOBI, AZW and AZW3 e-books into chaptered audiobooks (MP3 + M4B) using Microsoft Edge neural text-to-speech."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Filip Biernat" }]
keywords = ["epub", "mobi", "azw3", "ebook", "audiobook", "tts", "text-to-speech", "edge-tts", "m4b", "ffmpeg"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = ["edge-tts>=7.0", "mutagen>=1.47"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
bookvoice = "bookvoice.cli:main"

[project.gui-scripts]
bookvoice-gui = "bookvoice.gui:main"

[project.urls]
Homepage = "https://github.com/filipbiernat/bookvoice"
Issues = "https://github.com/filipbiernat/bookvoice/issues"

[tool.hatch.version]
path = "src/bookvoice/__init__.py"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
